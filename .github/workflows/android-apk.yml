name: Android APK

# Construit l'APK bêta HydroLoop Farm Manager (conteneur Capacitor qui charge l'application HTTPS).
# Aucun secret serveur n'est lu ni embarqué : seule l'URL publique de l'application est injectée.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS de l'application chargée par l'APK"
        required: false
        default: 'https://app.hydroloopfarm.com'
      smoke:
        description: "Lancer aussi le test sur émulateur (instance de recette locale, faux Supabase)"
        type: boolean
        default: true
  push:
    branches: ['feat/android-capacitor-apk-v1']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: HydroLoop-Farm-Manager-v1.0-beta.apk
  HYDROLOOP_APP_URL: ${{ github.event.inputs.app_url || 'https://app.hydroloopfarm.com' }}
  VERSION_NAME: 1.0-beta
  VERSION_CODE: '1'

jobs:
  build:
    name: Compilation de l'APK (debug bêta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # exigé par la chaîne Capacitor 7 / AGP 8.7 (le projet web n'est pas concerné)

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # ── Application web : tests existants (la version web n'est pas modifiée) ──
      - name: Dépendances de l'application web
        run: npm ci
      - name: Tests de l'application web
        run: npm test

      # ── Conteneur Android (script partagé avec le job de test sur émulateur) ──
      - name: Construction du conteneur et compilation Gradle (assembleDebug)
        run: |
          set -o pipefail
          bash mobile/scripts/build-apk.sh

      - name: Vérification de l'APK
        run: |
          set -euo pipefail
          SRC=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          [ -s "$SRC" ] || { echo "::error::APK absent ou vide"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/$APK_NAME"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "dist/$APK_NAME" > dist/badging.txt
          grep -E "^package:|dkVersion|uses-permission|launchable-activity" dist/badging.txt | tee dist/apk-info.txt
          grep -q "name='com.hydroloopfarm.manager'" dist/badging.txt
          grep -q "versionName='1.0-beta'" dist/badging.txt
          grep -qE "^(min)?[sS]dkVersion:'26'" dist/badging.txt
          grep -q "^targetSdkVersion:'35'" dist/badging.txt
          # Seule INTERNET est demandée ; la permission interne <paquet>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION est ajoutée par AndroidX (signature, propre à l'application).
          UNEXPECTED=$(grep "^uses-permission" dist/badging.txt | sed -E "s/.*name='([^']+)'.*/\1/" | grep -v -e '^android.permission.INTERNET$' -e '^com.hydroloopfarm.manager.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' || true)
          [ -z "$UNEXPECTED" ] || { echo "::error::permissions inattendues : $UNEXPECTED"; exit 1; }
          "$BT/apksigner" verify --verbose "dist/$APK_NAME" | tee dist/apksigner.txt
          SIZE=$(stat -c %s "dist/$APK_NAME"); echo "taille: $SIZE octets"
          [ "$SIZE" -gt 1000000 ] || { echo "::error::APK trop petit"; exit 1; }
          sha256sum "dist/$APK_NAME" | tee dist/SHA256SUMS.txt
          cp mobile/gradle-build.log dist/gradle-build.log
          # aucun secret serveur dans l'APK : motifs connus
          mkdir -p /tmp/apk && cd /tmp/apk && unzip -q -o "$GITHUB_WORKSPACE/dist/$APK_NAME"
          if grep -rIlE "sk-ant-|service_role|SUPABASE_JWT_SECRET|NEXTAUTH_SECRET|AUTH_USERS" /tmp/apk >/dev/null 2>&1; then
            echo "::error::motif de secret trouvé dans l'APK"; exit 1; fi
          echo "Aucun motif de secret dans l'APK." | tee -a "$GITHUB_WORKSPACE/dist/apk-info.txt"

      - name: Résumé
        run: |
          {
            echo "### APK bêta"
            echo "- Fichier : \`$APK_NAME\`"
            echo "- URL chargée : \`$HYDROLOOP_APP_URL\`"
            echo '```'; cat dist/apk-info.txt; cat dist/SHA256SUMS.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hydroloop-android-v1-beta
          path: |
            dist/${{ env.APK_NAME }}
            dist/SHA256SUMS.txt
            dist/apk-info.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydroloop-android-build-logs
          path: |
            mobile/gradle-build.log
            dist/gradle-build.log
            dist/badging.txt
            dist/apksigner.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fichiers à commiter (lockfile, projet Android généré)
        if: always()
        run: |
          mkdir -p handoff
          [ -f mobile/package-lock.json ] && cp mobile/package-lock.json handoff/ || true
          [ -d mobile/android ] && tar --exclude='.gradle' --exclude='build' --exclude='local.properties' --exclude='node_modules' -czf handoff/android-project.tgz -C mobile android capacitor.config.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-handoff
          path: handoff/
          if-no-files-found: ignore
          retention-days: 14

  commit-generated:
    name: Commit du lockfile et du projet Android générés
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: mobile-handoff
          path: handoff
      - name: Commiter les fichiers générés s'ils sont absents
        run: |
          set -euo pipefail
          CHANGED=0
          if [ ! -f mobile/package-lock.json ] && [ -f handoff/package-lock.json ]; then
            cp handoff/package-lock.json mobile/package-lock.json; CHANGED=1
          fi
          if [ ! -d mobile/android/app ] && [ -f handoff/android-project.tgz ]; then
            tar -xzf handoff/android-project.tgz -C mobile; CHANGED=1
          fi
          if [ "$CHANGED" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A mobile
            git commit -m "chore(android): lockfile Capacitor et projet Android générés par le workflow"
            git push
          else
            echo "Rien à commiter."
          fi

  smoke:
    name: Test sur émulateur Android (parcours principaux)
    needs: build
    if: github.event_name == 'push' || github.event.inputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # environnement de recette : données fictives, faux Supabase local, aucune production
      AUTH_USERS: 'alice:pw-alice-test,bob:pw-bob-test'
      NEXTAUTH_SECRET: recette-nextauth-secret-ci
      NEXTAUTH_URL: http://localhost:3100
      SUPABASE_JWT_SECRET: e2e-supabase-jwt-secret
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3199
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-test-key
      ANTHROPIC_API_KEY: ''
      MOCK_PORT: '3199'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - name: Application web de recette (build + faux Supabase)
        run: |
          npx next build
          nohup node e2e/mock-supabase.mjs > mock.log 2>&1 &
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3100/login >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:3100/login >/dev/null
          curl -fsS http://127.0.0.1:3199/__stats >/dev/null
      - name: APK de test (même code, URL de recette en clair uniquement pour localhost)
        env:
          SMOKE: '1'
          HYDROLOOP_APP_URL: http://localhost:3100
        run: |
          set -o pipefail
          bash mobile/scripts/build-apk.sh
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk smoke.apk
      - name: Pilote DevTools pour la WebView (outil de test, hors dépendances du produit)
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24
      - name: "Image système de l'émulateur (nouvelles tentatives, le téléchargement est parfois tronqué)"
        run: |
          for i in 1 2 3 4; do
            yes | sdkmanager --install 'system-images;android-34;google_apis;x86_64' && \
              sdkmanager --list_installed | grep -q 'system-images;android-34;google_apis;x86_64' && exit 0
            echo "tentative $i échouée"; rm -rf "$ANDROID_HOME/system-images/android-34"; sleep 10
          done
          exit 1
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 34 (x86_64) et scénario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash mobile/smoke/run.sh smoke.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydroloop-android-smoke-report
          path: |
            smoke-out/
            mock.log
            next.log
          if-no-files-found: ignore
          retention-days: 14
