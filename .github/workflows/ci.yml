name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Qualité (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # valeurs factices : servent à prouver qu'aucun secret serveur ne fuit dans le code client
          SUPABASE_JWT_SECRET: ci-fake-supabase-jwt-secret
          NEXTAUTH_SECRET: ci-fake-nextauth-secret
          AUTH_USERS: 'ci:ci-fake-password-value'
          ANTHROPIC_API_KEY: sk-ant-api03-CIFAKECIFAKECIFAKECIFAKE
          NEXT_PUBLIC_SUPABASE_URL: https://ci-fake.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fake-anon-key
      - name: Aucun secret serveur dans le code client
        run: npm run check:bundle
        env:
          SECRETS: ci-fake-supabase-jwt-secret,ci-fake-nextauth-secret,ci-fake-password-value,sk-ant-api03-CIFAKECIFAKECIFAKECIFAKE
      - name: Audit des dépendances de production (échec si vulnérabilité haute/critique)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Tests de bout en bout (hors ligne, PWA, accessibilité)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
